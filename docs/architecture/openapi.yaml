openapi: 3.1.0
info:
  title: Casa dos Frios CRM + atacado API
  version: 0.6.0
  description: |
    Canonical HTTP shapes for Casa dos Frios. TypeScript unions in packages/shared win if
    this file lags. Money is integer centavos. Authenticated tenant comes from the session
    cookie, not the body. No Account/billing routes. Chatwoot-parity CRM Phase A–E under
    /api/saas/crm/* + Loja widget (see docs/architecture/api.md + crm-chatwoot-parity.md).
    Legacy /api/saas/inbox* is deprecated after Conversation migration. WhatsApp and
    non-WA/voice channel I/O is stubbed (connection_status ≤ ready_stub); integrations
    ≤ connected_stub; Loja widget is first-party onto Conversation. Outbox is a transport
    stub. Phase B webhooks/bots use SSRF egress guard. Phase C campaigns use stub outbox
    category=campaign only — no Meta. Phase E Captain/SAML/integrations/voice are stubs —
    no unpaid live Meta/Slack/IdP/telephony/model providers.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK

  /api/identidade/cnpj:
    post:
      summary: CNPJ checksum + registry lookup (degrade allowed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnpj]
              properties:
                cnpj: { type: string }
      responses:
        "200": { description: Registry ok or unavailable with warning flags }
        "422": { description: checksum_invalido }
        "429": { description: rate_limit }

  /api/loja/tema:
    get:
      summary: Tenant theme tokens
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200": { description: ThemeTokens }

  /api/loja/config:
    get:
      summary: loja_modo + WhatsApp comercial config for CTA
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200": { description: LojaConfig }

  /api/loja/catalogo:
    get:
      summary: Loja projection — ativo && visivel_loja; available from single ledger
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Catalog page (codigo, nome, descricao, unidade, preco_atacado_centavos, qtd_min_atacado, available, sem_estoque)

  /api/loja/produtos/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Product projection }
        "404": { description: Inactive, hidden, or other tenant }

  /api/loja/cadastro:
    post:
      summary: Public B2B cadastro request (CNPJ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, contato_nome, cnpj, whatsapp]
              properties:
                email: { type: string }
                password: { type: string }
                contato_nome: { type: string }
                cnpj: { type: string }
                whatsapp: { type: string }
                razao_social: { type: string }
      responses:
        "201": { description: Cadastro pendente created }
        "422": { description: checksum or validation }
        "429": { description: rate_limit }

  /api/loja/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200": { description: Session cookie cdf_sessao_loja }
        "401": { description: Invalid }

  /api/loja/logout:
    post:
      responses:
        "204": { description: Cleared }

  /api/loja/sessao:
    get:
      responses:
        "200": { description: SessionDto }
        "401": { description: Unauthenticated }

  /api/loja/pedidos:
    get:
      responses:
        "200": { description: Own pedidos }
    post:
      description: Direct checkout for Cliente aprovado. Server freezes atacado prices and reserves stock.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [linhas]
              properties:
                linhas:
                  type: array
                  items:
                    type: object
                    required: [sku_id, qty]
                    properties:
                      sku_id: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        "201": { description: Pedido confirmado }
        "403": { description: cadastro_nao_aprovado or forbidden }
        "409": { description: estoque_insuficiente }

  /api/loja/orcamentos:
    get:
      responses:
        "200": { description: Own orcamentos }

  /api/loja/orcamentos/{id}/transicao:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [para]
              properties:
                para: { enum: [aceito, recusado] }
      responses:
        "200": { description: Transitioned; aceito may create Pedido }
        "403": { description: cadastro_nao_aprovado or forbidden }
        "409": { description: transicao_ilegal }

  /api/saas/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200": { description: Session cookie cdf_sessao_saas }

  /api/saas/logout:
    post:
      responses:
        "204": { description: Cleared }

  /api/saas/sessao:
    get:
      responses:
        "200": { description: SessionDto }

  /api/saas/usuarios:
    get:
      summary: Admin user list
      responses:
        "200": { description: Users }
        "403": { description: vendedor forbidden }
    post:
      summary: Create worker
      responses:
        "201": { description: Created }
        "403": { description: forbidden }

  /api/saas/inbox:
    get:
      deprecated: true
      summary: Legacy simulated threads — use /api/saas/crm/conversas
      responses:
        "200": { description: Deprecated; proxy to CRM during migration }

  /api/saas/inbox/simular:
    post:
      deprecated: true
      summary: Legacy simulator — use /api/saas/crm/simular
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, body]
              properties:
                phone_e164: { type: string }
                body: { type: string }
                intent_hint:
                  enum: [cadastro, orcamento, info_empresa, outro]
      responses:
        "201": { description: Deprecated }
        "403": { description: admin only }

  /api/saas/crm/inboxes:
    get:
      summary: CRM inboxes (Phase A)
      responses:
        "200": { description: Inbox list }
    post:
      summary: Admin create inbox
      responses:
        "201": { description: Created }
        "403": { description: admin only }

  /api/saas/crm/inboxes/{id}/channel:
    get:
      summary: WhatsApp channel config (secrets masked)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: ChannelWhatsapp DTO without raw secrets }
    put:
      summary: Save credentials (encrypted); connection_status ≤ ready_stub
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Saved }
        "422": { description: live status rejected }

  /api/saas/crm/conversas:
    get:
      summary: Conversation desk list
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Conversation page }

  /api/saas/crm/conversas/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Conversation + contact + labels }
        "404": { description: Missing or not visible }
    patch:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated status/assignee/priority/links }

  /api/saas/crm/conversas/{id}/mensagens:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Messages page }
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                private: { type: boolean }
      responses:
        "201": { description: Outgoing or private note }

  /api/saas/crm/simular:
    post:
      summary: Admin-only inbound simulator (Conversation)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, body]
              properties:
                inbox_id: { type: string }
                phone_e164: { type: string }
                body: { type: string }
                intent_label:
                  enum:
                    - "intent:cadastro"
                    - "intent:orcamento"
                    - "intent:info_empresa"
                    - "intent:outro"
      responses:
        "201": { description: Conversation + message + contact }
        "403": { description: admin only }

  /api/saas/crm/contatos:
    get:
      responses:
        "200": { description: Contact page }
    post:
      responses:
        "201": { description: Contact created }

  /api/saas/crm/empresas:
    get:
      responses:
        "200": { description: Company page }

  /api/saas/crm/labels:
    get:
      responses:
        "200": { description: Labels incl. system intents }

  /api/saas/crm/teams:
    get:
      responses:
        "200": { description: Teams }

  /api/saas/crm/respostas-rapidas:
    get:
      responses:
        "200": { description: Canned responses }

  /api/saas/crm/notificacoes:
    get:
      responses:
        "200": { description: Agent notifications }

  /api/saas/crm/presence:
    post:
      summary: Viewing/typing/availability heartbeat
      responses:
        "204": { description: Recorded }

  /api/saas/crm/events/stream:
    get:
      summary: SSE CRM events (Phase A realtime)
      responses:
        "200":
          description: text/event-stream

  /api/saas/crm/busca:
    get:
      summary: Global search conversations/contacts/messages
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Search hits }

  /api/saas/crm/automacoes:
    get:
      summary: List automation rules (Phase B, admin)
      responses:
        "200": { description: AutomationRule list }
    post:
      summary: Create automation rule
      responses:
        "201": { description: Created }

  /api/saas/crm/automacoes/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: AutomationRule }
    patch:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /api/saas/crm/automacoes/{id}/testar:
    post:
      summary: Dry-run automation conditions (no egress)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Match result }

  /api/saas/crm/macros:
    get:
      summary: List macros (public + own private)
      responses:
        "200": { description: Macro list }
    post:
      summary: Create macro
      responses:
        "201": { description: Created }

  /api/saas/crm/macros/{id}/executar:
    post:
      summary: Execute macro on conversations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Applied }

  /api/saas/crm/atributos:
    get:
      summary: Custom attribute definitions
      responses:
        "200": { description: Definitions }
    post:
      summary: Create definition (admin)
      responses:
        "201": { description: Created }

  /api/saas/crm/bots:
    get:
      summary: Agent bots (admin)
      responses:
        "200": { description: Bot list }
    post:
      summary: Create bot; outgoing_url SSRF-checked
      responses:
        "201": { description: Created; token once }

  /api/saas/crm/webhooks:
    get:
      summary: Account/inbox webhooks (admin)
      responses:
        "200": { description: Webhook list }
    post:
      summary: Create webhook; url SSRF-checked
      responses:
        "201": { description: Created }

  /api/saas/crm/webhooks/{id}/testar:
    post:
      summary: Enqueue sample webhook.deliver
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202": { description: Job enqueued }

  /api/saas/crm/inboxes/{id}/horarios:
    get:
      summary: Working hours for inbox
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Week + timezone }
    put:
      summary: Replace working hours (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Saved }

  /api/saas/crm/inboxes/{id}/politica-atribuicao:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: AssignmentPolicy }
    put:
      summary: Set round_robin policy (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Saved }

  /api/saas/crm/csat:
    get:
      summary: CSAT responses (admin)
      responses:
        "200": { description: CsatResponse list }

  /api/public/csat/{token}:
    get:
      summary: Public CSAT survey payload
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Minimal survey }
        "404": { description: Unknown/consumed }
    post:
      summary: Submit CSAT rating
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "201": { description: Recorded }
        "409": { description: Already submitted }

  /api/saas/crm/filtros:
    get:
      summary: Saved personal filters
      responses:
        "200": { description: CustomFilter list }
    post:
      responses:
        "201": { description: Created }

  /api/saas/crm/contatos/mesclar:
    post:
      summary: Merge two contacts
      responses:
        "200": { description: Survivor contact }

  /api/saas/crm/contatos/importar:
    post:
      summary: CSV contact import job
      responses:
        "202": { description: Batch enqueued }

  /api/saas/crm/campanhas:
    get:
      summary: List campaigns (admin)
      responses:
        "200": { description: Campaign list }
    post:
      summary: Create campaign draft (admin)
      responses:
        "201": { description: Campaign created }

  /api/saas/crm/campanhas/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Campaign }
    patch:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted draft/cancelled }
        "409": { description: Not deletable }

  /api/saas/crm/campanhas/{id}/enviar:
    post:
      summary: Send one_off (stub outbox) or activate ongoing awaiting_widget
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202": { description: Batch enqueued or ongoing activated }
        "422": { description: validacao }

  /api/saas/crm/campanhas/{id}/cancelar:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Cancelled }

  /api/saas/crm/campanhas/{id}/destinatarios:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: CampaignRecipient page }

  /api/saas/crm/central-ajuda/portal:
    get:
      summary: Tenant help center portal (admin)
      responses:
        "200": { description: Portal }
    put:
      summary: Upsert portal (admin)
      responses:
        "200": { description: Saved }

  /api/saas/crm/central-ajuda/categorias:
    get:
      responses:
        "200": { description: Category list }
    post:
      responses:
        "201": { description: Created }

  /api/saas/crm/central-ajuda/categorias/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Category }
    patch:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
        "409": { description: Has published articles }

  /api/saas/crm/central-ajuda/artigos:
    get:
      responses:
        "200": { description: Article list }
    post:
      responses:
        "201": { description: Created }

  /api/saas/crm/central-ajuda/artigos/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Article }
    patch:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /api/saas/crm/central-ajuda/artigos/{id}/publicar:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Published }

  /api/saas/crm/central-ajuda/artigos/{id}/despublicar:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Unpublished to draft }

  /api/public/central-ajuda/{portalSlug}:
    get:
      summary: Public portal metadata
      parameters:
        - name: portalSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Portal if enabled }
        "404": { description: Unknown or disabled }

  /api/public/central-ajuda/{portalSlug}/categorias:
    get:
      parameters:
        - name: portalSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Public categories }

  /api/public/central-ajuda/{portalSlug}/artigos:
    get:
      summary: Published articles only
      parameters:
        - name: portalSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Article list }

  /api/public/central-ajuda/{portalSlug}/artigos/{articleSlug}:
    get:
      parameters:
        - name: portalSlug
          in: path
          required: true
          schema: { type: string }
        - name: articleSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Published article }
        "404": { description: Draft/archived/unknown }

  /api/saas/crm/relatorios/visao-geral:
    get:
      summary: Overview report (admin)
      responses:
        "200": { description: Totals + daily series }
        "403": { description: vendedor forbidden }

  /api/saas/crm/relatorios/conversas:
    get:
      responses:
        "200": { description: Conversation series }

  /api/saas/crm/relatorios/agentes:
    get:
      responses:
        "200": { description: Per-agent metrics }

  /api/saas/crm/relatorios/labels:
    get:
      responses:
        "200": { description: Per-label metrics }

  /api/saas/crm/relatorios/inboxes:
    get:
      responses:
        "200": { description: Per-inbox metrics }

  /api/saas/crm/relatorios/equipes:
    get:
      responses:
        "200": { description: Per-team metrics }

  /api/saas/crm/relatorios/csat:
    get:
      responses:
        "200": { description: CSAT aggregates }

  /api/saas/crm/relatorios/bots:
    get:
      responses:
        "200": { description: Bot aggregates }

  /api/saas/crm/caixas/{id}/widget:
    get:
      summary: Website widget config (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Widget config }
        "404": { description: Not web_widget inbox }
    put:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
        "403": { description: admin only }

  /api/saas/crm/caixas/{id}/widget/snippet:
    get:
      summary: Embed snippet + website_token (no hmac)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Snippet }

  /api/saas/crm/caixas/{id}/canal/rotacionar-token:
    post:
      summary: Rotate website_token or API access token (plaintext once)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: New token returned once }
        "501": { description: live status unreachable }

  /api/saas/crm/modelos-email:
    get:
      summary: Email template stubs (admin)
      responses:
        "200": { description: Template list }
    post:
      responses:
        "201": { description: Created }

  /api/saas/crm/push/vapid-public:
    get:
      responses:
        "200": { description: VAPID public key }
        "404": { description: Push not configured }

  /api/saas/crm/push/subscriptions:
    post:
      summary: Register browser push (self)
      responses:
        "201": { description: Subscribed }

  /api/loja/widget/bootstrap:
    get:
      summary: Public widget bootstrap by website_token
      parameters:
        - name: website_token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Greeting, pre_chat, campaigns }
        "404": { description: Unknown token }

  /api/loja/widget/sessao:
    post:
      summary: Create widget session
      responses:
        "201": { description: session_token }
        "403": { description: Origin not allowed }

  /api/loja/widget/pre-chat:
    post:
      summary: Submit pre-chat fields (widget session)
      responses:
        "200": { description: Contact linked }
        "401": { description: Missing session }
        "422": { description: Required fields }

  /api/loja/widget/conversa:
    get:
      responses:
        "200": { description: Current conversation or null }
        "401": { description: Missing session }

  /api/loja/widget/mensagens:
    get:
      summary: Poll messages (primary realtime)
      responses:
        "200": { description: Message page }
    post:
      summary: Visitor message → CRM Conversation
      responses:
        "201": { description: Created on desk }
        "401": { description: Missing session }

  /api/loja/widget/events/stream:
    get:
      summary: Optional widget SSE
      responses:
        "200": { description: text/event-stream }

  /api/loja/widget/campanhas:
    get:
      summary: Active ongoing campaigns for widget inbox
      responses:
        "200": { description: Campaign payloads }

  /api/public/crm-client/mensagens:
    post:
      summary: API channel ingest (Bearer inbox token)
      responses:
        "201": { description: Message on Conversation }
        "401": { description: Invalid token }

  /api/public/crm-client/conversas/{source_id}/mensagens:
    get:
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Messages }
        "401": { description: Invalid token }
    post:
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201": { description: Created }

  /api/saas/crm/sla/politicas:
    get:
      summary: List SlaPolicy (Phase E)
      responses:
        "200": { description: Policies }
    post:
      summary: Create SlaPolicy
      responses:
        "201": { description: Created }

  /api/saas/crm/sla/politicas/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Policy }
    patch:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }
    delete:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }

  /api/saas/crm/conversas/{id}/sla:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: ConversationSla timers }
    post:
      summary: Apply SlaPolicy to conversation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Applied }
    delete:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Removed }

  /api/saas/crm/relatorios/sla:
    get:
      summary: SLA report series (Phase E — unlocks C 501)
      responses:
        "200": { description: Aggregates }
        "403": { description: Forbidden without admin or report_manage }

  /api/saas/crm/capacidade:
    get:
      summary: AgentCapacity list
      responses:
        "200": { description: Capacities }
    put:
      summary: Upsert AgentCapacity rows
      responses:
        "200": { description: Saved }

  /api/saas/crm/captain/sugerir:
    post:
      summary: Captain AI suggest (stub default)
      responses:
        "200": { description: CaptainSuggestion pending }
        "404": { description: Conversation not visible }

  /api/saas/crm/captain/sugestoes/{id}/aceitar:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Applied via desk APIs }

  /api/saas/crm/captain/status:
    get:
      summary: Captain provider status (stub vs live_unlocked)
      responses:
        "200": { description: Status }

  /api/saas/crm/auditoria:
    get:
      summary: Enterprise audit log
      responses:
        "200": { description: AuditEvent page }
        "403": { description: Forbidden }

  /api/saas/crm/seguranca/saml:
    get:
      summary: SAML config (secrets masked)
      responses:
        "200": { description: Config }
    put:
      summary: Upsert SAML IdP shape
      responses:
        "200": { description: Saved }

  /api/saas/crm/seguranca/mfa/iniciar:
    post:
      summary: Start MFA enroll (secret once)
      responses:
        "200": { description: Secret + otpauth URI }

  /api/saas/crm/seguranca/mfa/confirmar:
    post:
      summary: Confirm MFA with TOTP code
      responses:
        "200": { description: Enabled }

  /api/saas/login/mfa:
    post:
      summary: Second-step MFA login
      responses:
        "200": { description: Session issued }
        "401": { description: Invalid code }

  /api/saas/crm/papeis:
    get:
      summary: CustomRole list
      responses:
        "200": { description: Roles }
    post:
      summary: Create CustomRole
      responses:
        "201": { description: Created }

  /api/saas/crm/integracoes:
    get:
      summary: Integration catalog + install status
      responses:
        "200": { description: Providers }

  /api/saas/crm/integracoes/{provider}:
    get:
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Install (secrets masked) }
    put:
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Saved ≤ connected_stub }
        "501": { description: live rejected }

  /api/saas/crm/apps-painel:
    get:
      summary: DashboardApp list
      responses:
        "200": { description: Apps }
    post:
      summary: Create DashboardApp (URL egress-guarded)
      responses:
        "201": { description: Created }
        "422": { description: Egress blocked }

  /api/saas/crm/csat/{id}:
    patch:
      summary: CSAT review_note (Phase E)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated }

  /api/saas/crm/central-ajuda/portal/dominio:
    put:
      summary: Set Help Center custom_domain
      responses:
        "200": { description: Saved unverified }

  /api/saas/crm/central-ajuda/portal/dominio/verificar:
    post:
      summary: Verify custom domain DNS TXT (stub port ok)
      responses:
        "200": { description: verified or pending }

  /api/saas/cadastros:
    get:
      responses:
        "200": { description: Cadastro requests }

  /api/saas/cadastros/{id}/transicao:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [para]
              properties:
                para: { enum: [aprovado, recusado] }
                motivo_recusa: { type: string }
      responses:
        "200": { description: Transitioned; aprovado creates Cliente }
        "422": { description: motivo required on recusado }

  /api/saas/orcamentos:
    get:
      responses:
        "200": { description: Orcamento list }
    post:
      responses:
        "201": { description: Orcamento rascunho }

  /api/saas/orcamentos/{id}/transicao:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusTransition"
      responses:
        "200": { description: Transitioned }
        "403": { description: forbidden or cadastro_nao_aprovado }
        "409": { description: transicao_ilegal }

  /api/saas/pedidos:
    get:
      responses:
        "200": { description: Pedido list }
    post:
      description: Direct pedido for Cliente aprovado
      responses:
        "201": { description: Pedido confirmado + reserve }
        "403": { description: cadastro_nao_aprovado }

  /api/saas/pedidos/{id}/transicao:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusTransition"
      responses:
        "200": { description: Transitioned with stock side effects when applicable }
        "409": { description: transicao_ilegal or estoque_insuficiente }

  /api/saas/pedidos/{id}/faturar:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201": { description: Venda rascunho }
        "409": { description: conflito if non-cancelled Venda exists }

  /api/saas/vendas/{id}/transicao:
    post:
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [para]
              properties:
                para: { enum: [faturado, cancelado] }
      responses:
        "200": { description: Transitioned; faturado enqueues outbox }

  /api/saas/estoque:
    get:
      summary: List SKUs + ledger (admin, vendedor)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema: { type: string }
          description: Search codigo/nome
        - name: ativo
          in: query
          schema: { type: boolean }
        - name: visivel_loja
          in: query
          schema: { type: boolean }
      responses:
        "200": { description: SKU + ledger page (see inventory.md) }
    post:
      summary: Admin create SKU + balance (+ opening adjust if on_hand > 0)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstoqueCreate"
      responses:
        "201": { description: Created }
        "403": { description: vendedor forbidden }
        "409": { description: conflito codigo_duplicado }

  /api/saas/estoque/{id}:
    get:
      summary: SKU detail + balances
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Estoque item DTO }
        "404": { description: nao_encontrado }
    patch:
      summary: Admin patch master (not ledger qty)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstoquePatch"
      responses:
        "200": { description: Updated }
        "403": { description: admin only }
        "409": { description: conflito codigo_duplicado }

  /api/saas/estoque/{id}/movimentos:
    get:
      summary: Movement history (newest first)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Movement page }

  /api/saas/estoque/{id}/ajuste:
    post:
      summary: Admin stock adjust
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [delta_on_hand, motivo]
              properties:
                delta_on_hand: { type: integer, description: nonzero signed delta }
                motivo: { type: string, minLength: 1 }
      responses:
        "200": { description: Adjusted }
        "403": { description: admin only }
        "409": { description: on_hand would be < reserved }
        "422": { description: validacao (delta 0 or empty motivo) }

  /api/saas/estoque/{id}/visibilidade:
    patch:
      summary: Optional alias for visivel_loja (prefer PATCH master)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [visivel_loja]
              properties:
                visivel_loja: { type: boolean }
      responses:
        "200": { description: Updated }
        "403": { description: admin only }

  /api/saas/avisos:
    get:
      summary: Notification outbox (stub rows)
      responses:
        "200": { description: Outbox page }

components:
  parameters:
    TenantSlug:
      name: tenant
      in: query
      schema: { type: string, default: casa-dos-frios }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    StatusTransition:
      type: object
      required: [para]
      properties:
        para: { type: string }
    Unidade:
      type: string
      enum: [un, kg, cx, pct, lt]
    EstoqueCreate:
      type: object
      required: [codigo, nome, preco_atacado_centavos]
      properties:
        codigo: { type: string }
        nome: { type: string }
        descricao: { type: string, maxLength: 500, nullable: true }
        unidade: { $ref: "#/components/schemas/Unidade" }
        preco_atacado_centavos: { type: integer, minimum: 0 }
        desconto_max_pct: { type: integer, minimum: 0, maximum: 100, default: 0 }
        qtd_min_atacado: { type: integer, minimum: 1, default: 1 }
        visivel_loja: { type: boolean, default: true }
        ativo: { type: boolean, default: true }
        on_hand: { type: integer, minimum: 0, default: 0, description: create only }
    EstoquePatch:
      type: object
      properties:
        codigo: { type: string }
        nome: { type: string }
        descricao: { type: string, maxLength: 500, nullable: true }
        unidade: { $ref: "#/components/schemas/Unidade" }
        preco_atacado_centavos: { type: integer, minimum: 0 }
        desconto_max_pct: { type: integer, minimum: 0, maximum: 100 }
        qtd_min_atacado: { type: integer, minimum: 1 }
        visivel_loja: { type: boolean }
        ativo: { type: boolean }
    LinhaComDesconto:
      type: object
      required: [sku_id, qty]
      properties:
        sku_id: { type: string }
        qty: { type: integer, minimum: 1 }
        desconto_pct: { type: integer, minimum: 0, maximum: 100, default: 0, description: SaaS only; Loja must omit }
